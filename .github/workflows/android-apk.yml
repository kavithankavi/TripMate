name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TripMate-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk TripMate-release.apk
          gh release create "$TAG" TripMate-release.apk \
            --title "TripMate build ${{ github.run_number }}" \
            --notes "Installable Android APK built from ${{ github.sha }}." \
            --latest
